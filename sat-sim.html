<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1b4fd8;--blue-d:#1440ae;--ink:#1a1a1a;--mute:#5f6670;--line:#d5d9e0;--bg:#fff;--soft:#f3f5f9;--ok:#157a3e;--okbg:#e6f5ec;--bad:#b3261e;--badbg:#fdeceb;--warn:#b45309}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:var(--bg);font-size:17px}
button,input,select{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
.btn{border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:999px;padding:9px 22px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:#eef2ff}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* top bar */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px;border-bottom:3px solid #222;background:#fff;gap:10px}
.top .l b{display:block;font-size:16px}
.top .l small{color:var(--mute);font-family:system-ui}
.top .c{text-align:center;font-family:system-ui}
.top .c .t{font-size:24px;font-weight:700;letter-spacing:.5px}
.top .c button{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 12px;cursor:pointer;margin-top:2px;color:var(--mute)}
.top .r{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;color:#222}
.tool:hover,.tool.on{background:#eef2ff;border-color:var(--blue);color:var(--blue)}
.stripe{height:6px;background:repeating-linear-gradient(135deg,#222 0 10px,#fff 10px 16px,#e0457b 16px 26px,#fff 26px 32px,#2a8fe0 32px 42px,#fff 42px 48px)}
/* main */
.main{flex:1;display:flex;min-height:0}
.pane{flex:1;overflow:auto;padding:26px 34px;min-width:0}
.pane.left{border-right:2px solid #c3c8d1;background:#fff}
.pane.solo{max-width:900px;margin:0 auto}
.stim{line-height:1.6}
.stim img,.stem img,.opt img{max-width:100%}
.stim table{border-collapse:collapse;margin:10px 0}.stim td,.stim th{border:1px solid #999;padding:4px 10px}
.qhead{display:flex;align-items:center;gap:10px;background:var(--soft);border-bottom:2px solid #222;padding:6px 10px;margin:-26px -34px 18px;font-family:system-ui}
.qnum{background:#222;color:#fff;font-weight:700;padding:6px 12px;border-radius:2px}
.flagbtn{border:none;background:none;cursor:pointer;font-weight:600;color:#333;padding:4px 8px;border-radius:6px}
.flagbtn.on{color:#b3261e}.flagbtn:hover{background:#e6e9ef}
.sp{flex:1}
.qtimer{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.qtimer .bar{width:90px;height:8px;border-radius:5px;background:#dde1e8;overflow:hidden}
.qtimer .bar i{display:block;height:100%;width:0;background:var(--blue)}
.qtimer.over{color:var(--bad);font-weight:700}.qtimer.over .bar i{background:var(--bad)}
.chip{background:#e8ecf4;border-radius:999px;padding:1px 9px;font-size:12px;color:#444;white-space:nowrap}
.stem{line-height:1.6;margin-bottom:16px}
.opt{display:flex;align-items:stretch;gap:8px;margin:10px 0}
.opt .box{flex:1;display:flex;align-items:center;gap:14px;border:2px solid #333;border-radius:10px;padding:11px 14px;cursor:pointer;background:#fff}
.opt .box:hover{background:#f4f7ff}
.opt.sel .box{border-color:var(--blue);background:#eaf0ff;box-shadow:0 0 0 1px var(--blue)}
.opt .let{width:30px;height:30px;border-radius:50%;border:2px solid #333;display:grid;place-items:center;font-weight:700;font-family:system-ui;flex:none}
.opt.sel .let{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.gone .box{opacity:.45;text-decoration:line-through}
.opt .x{width:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;display:none;font-weight:700}
.elim .opt .x{display:block}
.opt.right .box{border-color:var(--ok);background:var(--okbg)}.opt.right .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong .box{border-color:var(--bad);background:var(--badbg)}.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:#fff}
.spr{font-family:system-ui}
.spr input{font-size:22px;padding:10px 14px;border:2px solid #333;border-radius:10px;width:220px}
.spr .hint{color:var(--mute);font-size:13px;margin-top:8px;line-height:1.5}
.spr .prev{margin-top:10px;font-weight:600}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;font-family:system-ui;line-height:1.55;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb h4{margin:0 0 6px;font-size:16px}
.fb .rat{margin-top:8px;font-family:Georgia,serif;font-size:15px}
.checkrow{margin-top:18px}
/* bottom */
.bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 22px;border-top:2px solid #cfd3da;background:#fff;font-family:system-ui}
.bot .nm{font-weight:700}
.qnavbtn{background:#222;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
.bot .r{display:flex;gap:10px;justify-content:flex-end}
/* modals */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:18px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:24px 28px;font-family:system-ui;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 4px}
.grid{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.gq{width:46px;height:46px;border:2px dashed #888;border-radius:8px;background:#fff;font-weight:700;cursor:pointer;position:relative}
.gq.ans{border:2px solid var(--blue);background:var(--blue);color:#fff}
.gq.cur{outline:3px solid #222;outline-offset:2px}
.gq .f{position:absolute;top:-8px;right:-6px;font-size:14px;color:#b3261e}
.legend{display:flex;gap:18px;font-size:13px;color:var(--mute);flex-wrap:wrap}
/* calculator */
#calc{position:fixed;right:20px;top:92px;width:480px;height:520px;min-width:300px;min-height:300px;background:#fff;border:2px solid #222;border-radius:10px;z-index:40;display:none;flex-direction:column;resize:both;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#calc .h{background:#222;color:#fff;padding:7px 12px;cursor:move;display:flex;justify-content:space-between;font-family:system-ui;font-weight:600;user-select:none}
#calc .h span{cursor:pointer}
#calcbody{flex:1;min-height:0}
/* home */
.home{max-width:860px;margin:0 auto;padding:36px 24px;font-family:system-ui;overflow:auto}
.home h1{font-family:Georgia,serif;margin:0 0 6px;font-size:34px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;background:#fff}
.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row label{display:flex;gap:6px;align-items:center}
.row input[type=number]{width:80px;padding:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--badbg);color:var(--bad)}.pill.na{background:#eee;color:#555}
.muted{color:var(--mute)}
.note{background:#fff8e5;border:1px solid #f0d58a;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.5}
.big{font-size:40px;font-weight:700}
.stats{display:flex;gap:16px;flex-wrap:wrap}.stats .card{flex:1;min-width:180px;margin:6px 0}
.center{display:grid;place-items:center;height:100%;font-family:system-ui;text-align:center;padding:20px}
.spin{width:38px;height:38px;border:4px solid #dde1e8;border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:800px){.main{flex-direction:column;overflow:auto}.pane.left{border-right:0;border-bottom:2px solid #c3c8d1}.top{grid-template-columns:1fr}.top .r,.top .c{text-align:left;justify-content:flex-start}#calc{left:10px;right:10px;width:auto}}
/* ===== landing page ===== */
.site{--ink:#0d1636;--mute:#5a6482;--line:#dfe4f2;--ult:#3a4ff0;--ult-d:#2a3bd0;--tint:#eceffe;--hi:#ffc83d;--bg:#f4f6fc;--panel:#fff;--mid:#0d1636;--mid2:#1b2a75;--ok:#0f9d7a;--okbg:#e3f6f0;--bad:#d93a50;--badbg:#fdecef;
  flex:1;overflow:auto;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55}
.site *{font-family:inherit}
.site a{color:var(--ult)}
.site .wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.nav{position:sticky;top:0;z-index:5;background:rgba(244,246,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:26px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto}
.brand svg{width:28px;height:28px}
.nav button.lnk{background:none;border:0;color:var(--mute);font-weight:600;cursor:pointer;padding:6px 2px}
.nav button.lnk:hover{color:var(--ink)}
.sbtn{border:0;background:var(--ult);color:#fff;font-weight:700;border-radius:10px;padding:11px 22px;cursor:pointer;font-size:16px;box-shadow:0 1px 0 rgba(14,19,48,.25)}
.sbtn:hover{background:var(--ult-d)}
.sbtn.sm{padding:8px 16px;font-size:15px}
.sbtn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sbtn.line:hover{background:var(--ink);color:#fff}
.sbtn.mini{padding:6px 12px;font-size:14px;font-weight:600;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.sbtn.mini:hover{box-shadow:inset 0 0 0 1.5px var(--ult);color:var(--ult);background:#fff}
.site :focus-visible{outline:3px solid var(--ult);outline-offset:2px;border-radius:6px}
.hero{padding:64px 0 34px;background:linear-gradient(180deg,#e4e9ff 0,#f4f6fc 100%)}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:0 0 20px;max-width:15em}
.hero p.lead{font-size:1.2rem;color:var(--mute);max-width:36em;margin:0 0 28px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.sheet{display:flex;gap:10px;margin-top:46px;align-items:stretch}
.sheet .gap{width:14px;flex:none}
.blk{background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;padding:16px 16px 14px;min-width:0;transition:opacity .25s,border-color .25s,transform .25s;display:flex;flex-direction:column;gap:12px}
.blk.dim{opacity:.38;border-color:var(--line)}
.blk header{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;line-height:1.25}
.blk header span{color:var(--mute);font-weight:600;white-space:nowrap}
.blk .dots{display:grid;gap:7px 7px;grid-template-columns:repeat(9,1fr);justify-items:center}
.blk.math .dots{grid-template-columns:repeat(11,1fr)}
.blk .dots i{width:100%;max-width:15px;aspect-ratio:1;border-radius:50%;border:1.5px solid #aab2c8;display:block}
.blk .dots i.on{background:var(--ult);border-color:var(--ult)}
.blk .dots i.mk{background:var(--hi);border-color:#b58f00}
.blk footer{font-size:14px;color:var(--mute);font-weight:500}
@media(prefers-reduced-motion:no-preference){.blk .dots i{animation:fillin .45s both;animation-delay:var(--d)}}
@keyframes fillin{from{background:transparent;border-color:#aab2c8;transform:scale(.6)}60%{transform:scale(1.15)}}
.sheetnote{margin:12px 2px 0;color:var(--mute);font-size:14px}
.sect{padding:56px 0 8px;scroll-margin-top:64px}
.sect h2{font-size:clamp(1.7rem,3vw,2.3rem);letter-spacing:-.025em;line-height:1.1;margin:0 0 8px;font-weight:800}
.sect .sub{color:var(--mute);margin:0 0 26px;max-width:40em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(14,19,48,.04)}
.rowset{display:grid;grid-template-columns:230px 1fr;gap:10px 36px;padding:30px 32px;border-top:1px solid var(--line)}
.rowset:first-child{border-top:0}
.rowset h3{margin:0 0 4px;font-size:1.05rem;font-weight:700}
.rowset .why{color:var(--mute);font-size:14.5px;margin:0}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.seg{position:relative;display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:#fff}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg b{display:block;font-size:1.02rem}
.seg span{color:var(--mute);font-size:14px}
.seg:hover{border-color:#b9c1dd}
.seg:has(input:checked){border-color:var(--ult);background:var(--tint);box-shadow:inset 0 0 0 1px var(--ult)}
.seg:has(input:checked) b::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hi);border:1.5px solid #b58f00;margin-left:8px;vertical-align:middle}
.seg:has(input:focus-visible){outline:3px solid var(--ult);outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--ult)}
.check b{display:block}
.check span{color:var(--mute);font-size:14.5px}
.grp{margin-top:22px}
.grp>b{display:block;margin-bottom:8px;font-size:15px}
.flds{display:flex;gap:12px;flex-wrap:wrap}
.fld{display:block;min-width:112px}
.fld>span:first-child{display:block;font-size:13.5px;color:var(--mute);margin-bottom:4px;font-weight:600}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 12px}
.inp:focus-within{border-color:var(--ult);box-shadow:0 0 0 3px var(--tint)}
.inp input{border:0;outline:0;width:100%;padding:10px 0;font-size:1.05rem;font-weight:700;background:transparent;color:var(--ink);font-family:inherit}
.inp em{font-style:normal;color:var(--mute);font-size:14px;margin-left:6px}
.hint{color:var(--mute);font-size:13.5px;margin:12px 0 0;max-width:44em}
.srcline{display:flex;gap:12px;flex-wrap:wrap}
.srcline .seg{flex:1;min-width:210px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.tag{background:var(--hi);color:var(--ink);font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px}
.aside{margin-top:16px;border-left:4px solid var(--hi);background:#fffbe9;padding:12px 16px;border-radius:0 10px 10px 0;font-size:14.5px;color:#3d3a2a}
.aside code,.site code{background:rgba(14,19,48,.07);padding:1px 5px;border-radius:5px;font-size:13px}
details.fmt{margin-top:10px;font-size:14px;color:var(--mute)}
details.fmt summary{cursor:pointer;font-weight:600;color:var(--ink)}
.startbar{display:flex;align-items:center;gap:18px;justify-content:space-between;padding:22px 32px;border-top:1px solid var(--line);background:#fafbff;border-radius:0 0 18px 18px;flex-wrap:wrap}
.startbar p{margin:0;color:var(--mute);font-size:14.5px}
.sbtn.big{font-size:18px;padding:14px 36px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.feat div{padding:20px 0;border-top:1px solid var(--line)}
.feat b{display:block;font-size:1.08rem;margin-bottom:4px}
.feat p{margin:0;color:var(--mute);max-width:30em}
table.fmtt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.fmtt th,table.fmtt td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
table.fmtt th{background:#fafbff;font-weight:700;color:var(--mute);font-size:14px}
table.fmtt tr:last-child td{border-bottom:0}
.foot{margin-top:64px;padding:40px 0 48px;background:var(--mid);color:#aab5e0;font-size:13.5px}
@media(max-width:860px){.rowset{grid-template-columns:1fr;padding:24px 20px}.segs{grid-template-columns:1fr}.feat{grid-template-columns:1fr}.sheet{flex-wrap:wrap}.sheet .gap{display:none}.blk{flex:1 1 calc(50% - 10px)!important}.nav .lnk{display:none}.hero{padding-top:40px}.startbar{padding:20px}}
.home h1{font-family:"Schibsted Grotesk",system-ui,sans-serif;letter-spacing:-.02em;font-weight:800}
.home{font-family:"Schibsted Grotesk",system-ui,sans-serif}
/* ===== results ===== */
.rhero{background:radial-gradient(900px 380px at 88% -10%,#3b4fc4 0,transparent 62%),linear-gradient(160deg,#0d1636 0,#16236a 100%);color:#fff;padding:56px 0 48px}
.rhero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.rhero .lbl{color:#b8c3f5;font-weight:600;margin-bottom:6px}
.rhero .score{font-size:clamp(4.2rem,10vw,7.6rem);font-weight:800;letter-spacing:-.055em;line-height:.95}
.rhero .score small{font-size:.26em;font-weight:600;color:#b8c3f5;letter-spacing:0;margin-left:12px}
.rhero .rng{color:#d7defc;margin-top:10px;font-size:1.05rem}
.rstats{display:flex;gap:36px;flex-wrap:wrap;margin-top:36px;padding-top:24px;border-top:1px solid rgba(255,255,255,.16)}
.rstats b{display:block;font-size:1.55rem;letter-spacing:-.02em}
.rstats span{color:#b8c3f5;font-size:14px}
.sb{margin-bottom:26px}
.sbh{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin-bottom:8px}
.sbh b{font-size:1.8rem;letter-spacing:-.03em}
.track{height:12px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.track .fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8d9bff,#ffc83d);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.sbf{display:flex;justify-content:space-between;color:#9fabe0;font-size:13px;margin-top:6px}
.tipgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.tipcol{padding:26px 28px}
.tipcol h3{margin:0 0 2px;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.tipcol .sub2{margin:0 0 6px;color:var(--mute);font-size:14.5px}
.tip{padding:18px 0 4px;border-top:1px solid var(--line);margin-top:14px}
.tip .nm{font-weight:700;font-size:1.05rem}
.tip .ms{font-size:13.5px;color:var(--bad);font-weight:600;margin-top:2px}
.mbar{height:6px;border-radius:9px;background:#edf0f9;margin:8px 0 12px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--bad);border-radius:9px}
.tip p{margin:0 0 8px}
.tip .try{color:var(--mute);font-size:14.5px}
.tip .try b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.tile .nm{font-weight:700;margin-bottom:2px}
.tile .rt{font-size:13.5px;color:var(--mute);margin-bottom:10px}
.tile .v{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.tile .v small{font-size:.5em;color:var(--mute);font-weight:600;letter-spacing:0}
.pbar{height:8px;border-radius:9px;background:#edf0f9;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ult);border-radius:9px}
.pbar i.ok{background:var(--ok)}.pbar i.bad{background:var(--bad)}
.site .pill.ok{background:var(--okbg);color:var(--ok)}.site .pill.no{background:var(--badbg);color:var(--bad)}.site .pill.na{background:#eceff7;color:#5a6482}
table.fmtt.rv tr[data-rv]{cursor:pointer}table.fmtt.rv tr[data-rv]:hover td{background:#f6f8ff}

 ['rw','CAS','M','mcq','','The researcher\'s conclusions were ______, supported by three independent experiments that produced the same result.',['tentative','corroborated','ambiguous','outdated'],[1],'"Corroborated" means confirmed by additional evidence, which fits the three matching experiments.'],

function strip(h){ return String(h||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim(); }

function pick(o,...ks){ for(const k of ks){ if(o&&o[k]!=null&&o[k]!=='') return o[k]; } return ''; }

  if(q.domain==='SEC'||/boundaries|form, structure|form structure|\bbou\b|\bfss\b/.test(s)||/conventions of standard english/.test(st)) return 'grammar';

// Loads one question, trying every route the bank is known to use, and returns the first one that parses.
async function fetchRaw(item){

  if(item.ibn) tries.push(()=>fetch('https://saic.collegeboard.org/disclosed/'+encodeURIComponent(item.ibn)+'.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }));

function pickDifficulty(mix){ const r=Math.random(); return r<mix.E?'E':(r<mix.E+mix.M?'M':'H'); }
async function fetchValid(it,list,m){
  const tried=new Set(); let cur=it;

    tried.add(cur.id);
    try{ const q=await getQ(cur); if(valid(q)) return q; ST.dropped++; logBad(cur,q); console.warn('Skipped unparseable question',cur.id,q); }
    catch(e){ ST.dropped++; logBad(cur,null,e); console.warn('Fetch failed',cur.id,e); }
    let alt=list.filter(x=>x.domain===it.domain&&it.sk&&x.sk===it.sk&&!tried.has(x.id)&&!ST.used.has(x.id));
    if(!alt.length) alt=list.filter(x=>x.domain===it.domain&&!tried.has(x.id)&&!ST.used.has(x.id));
    if(m.pool!=='seen'){ const fa=alt.filter(x=>!isSeen(x)); if(fa.length) alt=fa; }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// Reading & Writing is ordered by domain, then by skill, as on the digital SAT
const RW_DOM=['CAS','INI','SEC','EOI'];
const SKILL_RANK=[/words in context|\bwic\b/,/text structure|\btsp\b/,/cross-text|\bctc\b/,/central ideas|\bcid\b/,/command of evidence|\bcoe\b/,/inferences|\binf\b/,/boundaries|\bbou\b/,/form, structure|form structure|\bfss\b/,/rhetorical synthesis|\bsyn\b/,/transitions|\btra\b/];
const RW_SKILL=['WIC','TSP','CTC','CID','COET','COEQ','INF','BOU','FSS','TRA','SYN'];
function skillRankOld(q){ const s=String(q.skill||'').toLowerCase(); const i=SKILL_RANK.findIndex(r=>r.test(s)); if(i>=0) return i; return q.cat==='vocab'?0:q.cat==='grammar'?6:99; }
// Real math modules climb from easy to hard only roughly, and topics are interleaved rather than grouped.
// Each question gets its difficulty band plus random jitter, so neighbouring bands overlap a little.
// Then runs of the same skill (or three in a row from one domain) are broken up.
function orderMath(arr){
  const band={E:0,M:1,H:2};
  const a=arr.map(q=>({q,k:(band[q.diff]??1)+(Math.random()-.5)*1.15})).sort((x,y)=>x.k-y.k).map(x=>x.q);
  const bad=(i)=>{ const q=a[i]; if(!q) return false; const p=a[i-1], pp=a[i-2];
    if(p&&q.sk&&q.sk===p.sk) return true;
    return !!(p&&pp&&q.domain&&q.domain===p.domain&&q.domain===pp.domain); };
  for(let i=1;i<a.length;i++){
    if(!bad(i)) continue;
    for(let j=i+1;j<Math.min(a.length,i+5);j++){
      [a[i],a[j]]=[a[j],a[i]];

}
function orderModule(sec,out){
  const sh=shuffle(out);

  return sh.sort((a,b)=>RW_DOM.indexOf(a.domain)-RW_DOM.indexOf(b.domain)||((RW_SKILL.indexOf(a.sk)+1)||99)-((RW_SKILL.indexOf(b.sk)+1)||99));

// ~75% multiple choice / ~25% student-produced response (16 or 17 MC out of 22)
async function enforceTypes(out,list,pool){
  const total=out.length, mc=Math.random()<.5?Math.floor(total*.75):Math.ceil(total*.75), sprT=total-mc;
  const inMod=new Set(out.map(q=>q.id)), tried=new Set();
  for(let tries=0;tries<45;tries++){
    const spr=out.filter(q=>q.type==='spr').length; if(spr===sprT) return;
    const need=spr>sprT?'mcq':'spr';
    const ks=out.map((q,k)=>k).filter(k=>out[k].type!==need&&!out[k].fallback);
    if(!ks.length) return;
    const k=rnd(ks), q0=out[k];
    const base=x=>!inMod.has(x.id)&&!tried.has(x.id), pref=x=>pool==='seen'?isSeen(x):pool==='mix'?true:!isSeen(x);
    let cand=[];
    for(const fresh of [x=>base(x)&&pref(x)&&!ST.used.has(x.id),x=>base(x)&&!ST.used.has(x.id),base]){   // questions that fit the pool first, anything else only if none fit
      cand=list.filter(x=>fresh(x)&&x.domain===q0.domain&&x.sk&&x.sk===q0.sk&&x.diff===q0.diff);
      if(!cand.length) cand=list.filter(x=>fresh(x)&&x.domain===q0.domain&&x.sk&&x.sk===q0.sk);
      if(!cand.length) cand=list.filter(x=>fresh(x)&&x.domain===q0.domain&&x.diff===q0.diff);
      if(!cand.length) cand=list.filter(x=>fresh(x)&&x.domain===q0.domain);
      if(cand.length) break;
    }
    if(!cand.length) continue;
    const it=rnd(cand); tried.add(it.id);
    try{ const q=await getQ(it); if(valid(q)&&q.type===need){ out[k]=q; inMod.add(q.id); ST.used.add(q.id); } }catch(e){}
  }
}
function allocate(specs,count){
  const c={}; let sum=0; specs.forEach(([k,mn])=>{ c[k]=mn; sum+=mn; });
  let rem=count-sum;
  while(rem>0){
    const cands=specs.filter(([k,mn,mx])=>c[k]<mx); if(!cands.length) break;
    const lo=Math.min(...cands.map(([k])=>ST.skillUse[k]||0));
    const k=rnd(cands.filter(([k])=>(ST.skillUse[k]||0)===lo))[0];
    c[k]++; rem--;
  }
  return c;
}
async function buildModule(m){
  const spec=SPEC[m.sec], list=await getList(m.sec), chosen=[];
  for(const [dom,cnt] of Object.entries(spec.dist)){
    const alloc=allocate(MODSPEC[m.sec][dom],cnt);
    for(const [key,n] of Object.entries(alloc)){
      for(let i=0;i<n;i++){
        // prefer this skill, then items whose skill is unknown, then anything in the domain
        const free=q=>q.domain===dom&&!chosen.includes(q), nu=q=>!ST.used.has(q.id), fr=q=>nu(q)&&!isSeen(q);
        // never-seen questions first (same skill, then any skill in the domain), then seen ones as a last resort
        let pool=list.filter(q=>free(q)&&q.sk===key&&fr(q));
        if(!pool.length) pool=list.filter(q=>free(q)&&!q.sk&&fr(q));
        if(!pool.length) pool=list.filter(q=>free(q)&&fr(q));
        if(!pool.length) pool=list.filter(q=>free(q)&&q.sk===key&&nu(q));
        if(!pool.length) pool=list.filter(q=>free(q)&&nu(q));
        if(!pool.length) pool=list.filter(free);
        if(!pool.length) pool=list.filter(q=>!chosen.includes(q));
        if(!pool.length) pool=list.slice();
        const want=pickDifficulty(m.mix);
        const sub=pool.filter(q=>q.diff===want);
        const p=rnd(sub.length?sub:pool);
        chosen.push(p); ST.used.add(p.id);
      }
    }
  }
  const out=[]; let idx=0;
  async function worker(){ while(idx<chosen.length){ const k=idx++; out[k]=await fetchValid(chosen[k],list,m); } }
  await Promise.all(Array.from({length:6},worker));
  if(m.sec==='math') await enforceTypes(out,list);
  ST.repeats=(ST.repeats||0)+out.filter(isSeen).length;
  out.forEach(q=>{ if(q.sk) ST.skillUse[q.sk]=(ST.skillUse[q.sk]||0)+1; });
  return orderModule(m.sec,out);
}

// ---------- grading ----------
function num(s){ s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,''); if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,'');

function isCorrect(q,a){

// ----- quick practice -----
function skillWeights(sec){
  const w={};
  for(const [dom,tot] of Object.entries(SPEC[sec].dist)){
    const sp=MODSPEC[sec][dom], raw=sp.map(([k,mn,mx])=>(mn+mx)/2), sum=raw.reduce((a,b)=>a+b,0);
    sp.forEach(([k],i)=>{ w[k]=tot*raw[i]/sum; });
  }
  return w;
}
// Spread n questions across the enabled skills in the real per-module proportions.
// cap (optional) limits each skill to the number of questions actually available.
function allocQuick(sec,n,en,jitter,cap){
  const w=skillWeights(sec);
  let ks=allKeys(sec).filter(k=>en.has(k)&&(!cap||cap[k]>0));
  const out={}; ks.forEach(k=>{ out[k]=0; });
  const total=cap?Math.min(n,ks.reduce((a,k)=>a+cap[k],0)):n;
  let left=total;
  while(left>0&&ks.length){
    const sum=ks.reduce((a,k)=>a+w[k],0), quota=ks.map(k=>left*w[k]/sum), fr=[]; let used=0;
    ks.forEach((k,i)=>{ const f=Math.floor(quota[i]); out[k]+=f; used+=f; fr.push(quota[i]-f); });
    const r=left-used;
    if(r>0){
      if(jitter){ // systematic sampling: each skill is rounded up with probability equal to its fractional part
        const order=shuffle(ks.map((k,i)=>i)), u=Math.random(); let cum=0; const ivs=order.map(i=>{ const lo=cum; cum+=fr[i]; return [i,lo,cum]; });
        for(let t=0;t<r;t++){ const pt=u+t, hit=ivs.find(v=>pt>=v[1]&&pt<v[2])||ivs[ivs.length-1]; out[ks[hit[0]]]++; }
      } else { // preview: round up the largest fractions
        ks.map((k,i)=>[k,fr[i]]).sort((x,y)=>y[1]-x[1]).slice(0,r).forEach(x=>{ out[x[0]]++; });
      }
    }
    if(cap) ks.forEach(k=>{ if(out[k]>cap[k]) out[k]=cap[k]; });
    left=total-ks.reduce((a,k)=>a+out[k],0);
    if(cap) ks=ks.filter(k=>out[k]<cap[k]);
  }
  return out;
}
function pickDiff(mix,diffs){ const ws=diffs.map(d=>mix[d]||.1); let r=Math.random()*ws.reduce((a,b)=>a+b,0); for(let i=0;i<diffs.length;i++){ r-=ws[i]; if(r<=0) return diffs[i]; } return diffs[diffs.length-1]; }
async function buildQuick(m){
  const list0=await getList(m.sec), en=new Set(m.skills), dset=new Set(m.diffs||['E','M','H']);
  const tagged=list0.some(x=>x.sk);
  // strict filter: only questions on an enabled skill AND an enabled difficulty
  const pm=m.pool||'mix';
  const list=list0.filter(x=>dset.has(x.diff)&&(tagged?(x.sk&&en.has(x.sk)):true)&&(pm==='mix'||(pm==='new'?!isSeen(x):isSeen(x))));
  ST.qnote='';
  if(!list.length){ m.emptyMsg=pm==='new'?'You have already answered every question that matches your choices.':pm==='seen'?'You have not answered any questions that match your choices yet.':'No questions in this question set match the skills and difficulty levels you chose.'; return []; }
  let chosen=[];
  if(tagged){
    const cap={}; list.forEach(x=>{ cap[x.sk]=(cap[x.sk]||0)+1; });
    const alloc=allocQuick(m.sec,m.count,en,true,cap), ds=[...dset];
    for(const [key,n] of Object.entries(alloc)){
      for(let i=0;i<n;i++){
        let pool=list.filter(q=>q.sk===key&&!chosen.includes(q));
        const fresh=pool.filter(q=>!ST.used.has(q.id)); if(fresh.length) pool=fresh;
        const want=pickDiff(m.mix,ds), sub=pool.filter(q=>q.diff===want);
        const p=rnd(sub.length?sub:pool); chosen.push(p); ST.used.add(p.id);
      }
    }
  } else {
    const sh=shuffle(list); chosen=sh.filter(q=>!ST.used.has(q.id)).concat(sh.filter(q=>ST.used.has(q.id))).slice(0,m.count);
    chosen.forEach(q=>ST.used.add(q.id));
    ST.qnote='These questions have no skill labels, so your skill choices could not be applied.';
  }
  if(chosen.length<m.count) ST.qnote=(ST.qnote?ST.qnote+' ':'')+`Only ${chosen.length} question${chosen.length===1?' was':'s were'} available for your choices, so this set is shorter than the ${m.count} you asked for.`;
  const out=[]; let idx=0;
  async function worker(){ while(idx<chosen.length){ const k=idx++; out[k]=await fetchValid(chosen[k],list,m); } }
  await Promise.all(Array.from({length:Math.min(6,Math.max(1,chosen.length))},worker));
  if(m.sec==='math') await enforceTypes(out,list,m.pool||'mix');
  return orderModule(m.sec,out);
}

function saveMissed(all){
  const map=new Map(ld(MK,[]).map(q=>[q.id,q])), tags=ld(TG,{}), srs=ld(SRSK,{}), now=Date.now();
  all.forEach(r=>r.qs.forEach((q,i)=>{

        if(b>=SRS_DAYS.length){ map.delete(q.id); delete tags[q.id]; delete srs[q.id]; }
        else srs[q.id]={b,d:now+SRS_DAYS[b]*864e5}; }
    } else { map.set(q.id,q); srs[q.id]={b:0,d:now+SRS_DAYS[0]*864e5}; }
  }));
  Object.keys(tags).forEach(k=>{ if(!map.has(k)) delete tags[k]; });

  let extra='';
  if(prev!=null&&cur!=null){ const dl=cur-prev; extra+=`<div class="delta ${dl>=0?'up':'dn'}">${dl>0?'+':''}${dl} since your last ${tot?'full test':'estimate'}</div>`; }
  if(tot&&pf.target){ const gp=pf.target-tot.s; extra+=`<div class="rng" style="margin-top:10px">${gp>0?gp+' points to your target of '+pf.target:'You have reached your target of '+pf.target}</div>`; }
  const heroLeft=tot?`<div class="lbl">Estimated total score</div><div class="score"><span id="sv" data-v="${tot.s}">${tot.s}</span><small>out of 1600</small></div><div class="rng">Likely range ${tot.lo}–${tot.hi}</div>${extra}`
    :one?`<div class="lbl">Estimated ${er?'Reading and Writing':'Math'} score</div><div class="score"><span id="sv" data-v="${one.score}">${one.score}</span><small>out of 800</small></div><div class="rng">Likely range ${one.lo}–${one.hi}</div>${extra}`
    :`<div class="lbl">Your results</div><div class="score"><span id="sv" data-v="${tc}">${tc}</span><small>out of ${tq} correct</small></div>`;
  const bar=(label,e)=>e?`<div class="sb"><div class="sbh"><span>${label}</span><b>${e.score}</b></div><div class="track"><i class="fill" style="width:0" data-w="${Math.max(2,(e.score-200)/6)}"></i></div><div class="sbf"><span>200</span><span>Likely ${e.lo}–${e.hi} · ${e.hard?'harder':'easier'} Module 2</span><span>800</span></div></div>`:'';
  const modTiles=all.map(r=>{ const p=r.score/r.qs.length; return `<div class="tile"><div class="nm">${esc(SPEC[r.m.sec].name)}</div><div class="rt">${r.m.daily?"Today's session":r.m.quick?'Quick practice':r.m.retry?'Retry set':'Module '+r.m.n}${r.hard!==undefined?' · '+(r.hard?'harder route':'easier route'):''}${r.timeUp?' · time ran out':''}</div><div class="v">${r.score}<small> / ${r.qs.length}</small></div><div class="pbar"><i class="${p>=.8?'ok':p<.5?'bad':''}" style="width:${Math.round(p*100)}%"></i></div></div>`; }).join('');
  const dom={}; all.forEach(r=>r.qs.forEach((q,i)=>{ const k=r.m.sec+q.domain; const o=dom[k]=dom[k]||{n:SPEC[r.m.sec].domNames[q.domain]||q.domain,sec:SPEC[r.m.sec].name,c:0,t:0,time:0}; o.t++; if(isCorrect(q,r.ans[i])) o.c++; o.time+=(r.qtime[i]||0)/1000; }));
  const domRows=Object.values(dom).map(d=>{ const p=d.c/d.t; return `<tr><td><b>${esc(d.n)}</b><div class="muted" style="font-size:13px">${esc(d.sec)}</div></td><td style="width:34%"><div class="pbar"><i class="${p>=.8?'ok':p<.5?'bad':''}" style="width:${Math.round(p*100)}%"></i></div></td><td>${d.c}/${d.t} · ${Math.round(p*100)}%</td><td>${fmt(d.time/d.t)}</td></tr>`; }).join('');
  const tables=all.map((r,ri)=>`<h3 style="margin:28px 0 10px;font-size:1.1rem">${esc(r.m.label)}${r.hard!==undefined?(r.hard?' · harder module':' · easier module'):''}</h3><div class="tbwrap"><table class="fmtt rv"><tr><th>#</th><th>Content area</th><th>Skill</th><th>Level</th><th>Result</th><th>Your answer</th><th>Correct</th><th>Time</th></tr>
    ${r.qs.map((q,i)=>{ const a=r.ans[i], ok=isCorrect(q,a), t=(r.qtime[i]||0)/1000, none=(a===undefined||a==='');
      return `<tr data-rv="${ri}-${i}"><td>${i+1}${r.flag[i]?' ⚑':''}</td><td>${esc(SPEC[r.m.sec].domNames[q.domain]||q.domain)}</td><td>${esc(q.skillName||'—')}</td><td>${{E:'Easy',M:'Medium',H:'Hard'}[q.diff]||''}</td>
      <td><span class="pill ${none?'na':ok?'ok':'no'}">${none?'Omitted':ok?'Correct':'Wrong'}</span></td><td>${none?'—':(q.type==='mcq'?'ABCD'[a]:esc(a))}</td><td>${esc(answerText(q))}</td>
      <td class="${t>r.tgs[i]?'over':''}">${fmt(t)} <span class="muted">/ ${fmt(r.tgs[i])}</span></td></tr>`; }).join('')}</table></div>`).join('');
  const secs=['rw','math'].filter(x=>all.some(r=>r.m.sec===x));
  const skAll=secs.flatMap(skillStats).filter(o=>SKN[o.k]).sort((a,b)=>b.n-a.n).slice(0,7);
  const skBars=(!er&&!em&&skAll.length)?`<div class="lbl sk">Accuracy by skill</div>`+skAll.map(o=>`<div class="skr"><div class="sbh"><span>${esc(o.name)}</span><b>${o.n-o.miss}/${o.n}</b></div><div class="track"><i class="fill" style="width:0" data-w="${Math.round((o.n-o.miss)/o.n*100)}"></i></div></div>`).join(''):'';
  const insights=paceInsights(all);
  const paceSection=`<section class="sect"><div class="wrap"><h2>Pace and focus</h2><p class="sub">Each bar is one question. Its height is the time you spent, and the dark mark is your time target.</p>
    <div class="panel" style="padding:22px 24px"><div class="pacewrap">${paceChart(all)}</div><div class="legend2"><span><i style="background:#0f9d7a"></i>Correct</span><span><i style="background:#d93a50"></i>Wrong</span><span><i style="background:#b9c1dd"></i>Blank</span><span><i class="tk"></i>Time target</span></div></div>
    <div class="tiles" style="margin-top:14px">${insights.length?insights.map(c=>`<div class="tile"><div class="nm">${esc(c.t)}</div><div class="v">${c.n}</div><p class="note2">${esc(c.d)}</p></div>`).join(''):`<div class="tile"><div class="nm">Steady pacing</div><p class="note2">You had no rushed or overlong misses. Keep answering each question within its time target.</p></div>`}</div><div id="reasons">${reasonsInner()}</div></div></section>`;
  const nFlag=all.reduce((a,r)=>a+Object.keys(r.flag).filter(k=>r.flag[k]).length,0);
  const reviewBtns=`<div class="tools" style="margin:0 0 6px">${missed?`<button class="sbtn mini" data-rvk="missed" type="button">Review ${missed} missed</button>`:''}${nFlag?`<button class="sbtn mini" data-rvk="flagged" type="button">Review ${nFlag} marked</button>`:''}${over?`<button class="sbtn mini" data-rvk="slow" type="button">Review ${over} over time</button>`:''}<button class="sbtn mini" data-rvk="all" type="button">Review all ${tq}</button></div>`;
  const notes=(ST.qnote&&all[0].m.quick?`<div class="aside rnote">${esc(ST.qnote)}</div>`:'')+(demo?`<div class="aside rnote">Some or all questions in this test came from the built-in demo set or an imported file instead of the live College Board bank, so the estimate and tips are less meaningful.</div>`:'')
    +(ST.repeats&&!all[0].m.quick?`<div class="aside rnote">${ST.repeats} question${ST.repeats>1?'s':''} in this test were repeats from your earlier practice, so the estimate may run high. This happens when the bank has too few unseen questions left for a skill.</div>`:'')
    +(ST.dropped?`<div class="aside rnote">${ST.dropped} question(s) from the bank came back in an unexpected format and were swapped for others. The reason is saved in the skipped-question report on the home screen.</div>`:'')
    +(tot||one?`<div class="aside rnote">The score is a rough estimate. It weights each question by difficulty and accounts for an easier or harder Module 2, but the real exam uses a confidential scoring curve. Expect about 30 points either way per section.</div>`:'');
  const pace=tq&&over/tq>.25?`<div class="aside" style="margin-top:22px"><b>Pacing:</b> you went over your time target on ${over} of ${tq} questions (${Math.round(over/tq*100)}%). Practice the skills above with a timer on, and move on from any question that runs past its target.</div>`:'';
  app.innerHTML=`<div class="site" id="site">
  <nav class="nav"><div class="wrap"><div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="#0d1636"/><circle cx="9" cy="9" r="3.2" fill="#ffc83d"/><circle cx="19" cy="9" r="3.2" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="9" cy="19" r="3.2" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="19" cy="19" r="3.2" fill="#fff"/></svg>SAT Simulator</div>
  <button class="lnk thm" id="theme" type="button"></button><button class="sbtn sm line" id="prt" type="button">Print report</button><button class="sbtn sm" id="again">New test</button></div></nav>
  <main>
  <section class="rhero"><div class="wrap">
    <div>${heroLeft}<div class="rstats"><div><b>${tc}/${tq}</b><span>${Math.round(tc/tq*100)}% correct</span></div><div><b>${fmt(totalT/tq)}</b><span>average time per question</span></div><div><b>${over}</b><span>over your time target</span></div></div></div>
    <div>${bar('Reading and Writing',er)}${bar('Math',em)}${skBars}</div>
  </div></section>
  <div class="wrap" style="padding-top:26px"><div class="muted" style="font-size:14px;margin-bottom:12px">Question source: ${esc(ST.sourceNote)}</div>${notes}</div>
  <section class="sect"><div class="wrap">
    <h2>Where to gain the most points</h2>
    <p class="sub">Ranked by the questions you missed, with easier misses counted more because they are the quickest points to win back.</p>
    <div class="tipgrid" style="${secs.length===1?'grid-template-columns:1fr':''}">${secs.map(tipCol).join('')}</div>${pace}${missed?`<p style="margin-top:24px"><button class="sbtn big line" id="retry">Practice the ${missed} question${missed>1?'s':''} you missed</button></p>`:''}
  </div></section>
  ${paceSection}
  <section class="sect"><div class="wrap"><h2>Module scores</h2><p class="sub">Questions correct in each module.</p><div class="tiles">${modTiles}</div></div></section>
  <section class="sect"><div class="wrap"><h2>By content area</h2><p class="sub">How you did in each domain, and how long you spent per question.</p>
    <div class="panel" style="padding:6px 22px"><table class="fmtt" style="border:0"><tr><th>Content area</th><th>Accuracy</th><th>Correct</th><th>Avg time</th></tr>${domRows}</table></div></div></section>
  <section class="sect"><div class="wrap"><h2>Question review</h2><p class="sub">Step through your questions with explanations, or select any row to open one.</p>${reviewBtns}${tables}
    <p style="margin-top:34px"><button class="sbtn big" id="again2">Take another test</button></p></div></section>
  </main>
  <footer class="foot"><div class="wrap">SAT Simulator is an independent practice tool. It is not affiliated with or endorsed by College Board. SAT is a registered trademark of College Board.</div></footer></div>`;
  $('#again').onclick=home; $('#again2').onclick=home;
  const rb=$('#retry'); if(rb) rb.onclick=startRetry;
  document.querySelectorAll('[data-rvk]').forEach(b=>b.onclick=()=>openReview(b.dataset.rvk));
  const pr=$('#prt'); if(pr) pr.onclick=()=>window.print();
  bindTheme();
  document.querySelectorAll('[data-prac]').forEach(b=>b.onclick=()=>startSkills(b.dataset.prac,b.dataset.keys.split(',')));
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(f=>{ f.style.width=f.dataset.w+'%'; })));
  const svn=$('#sv'); if(svn&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ const to=+svn.dataset.v, t0=performance.now(); const step=t=>{ const p=Math.min(1,(t-t0)/1100); svn.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
  document.querySelectorAll('[data-rv]').forEach(tr=>tr.onclick=()=>{
    const [ri,i]=tr.dataset.rv.split('-').map(Number), r=all[ri], q=r.qs[i], a=r.ans[i];
    modal(`<div class="muted">${esc(r.m.label)} · Question ${i+1}${q.skillName?' · '+esc(q.skillName):''}</div>${q.stimulus?`<div class="stim" style="margin:12px 0">${q.stimulus}</div>`:''}<div class="stem" style="margin:12px 0">${q.stem}</div>
      ${q.type==='mcq'?q.options.map((o,k)=>`<div class="opt ${q.correct.includes(k)?'right':(a===k?'wrong':'')}"><div class="box"><span class="let">${'ABCD'[k]}</span><span>${o}</span></div></div>`).join(''):`<p>Your answer: <b>${esc(a||'—')}</b></p>`}
      <div class="fb ${isCorrect(q,a)?'ok':'no'}"><h4>Correct answer: ${esc(answerText(q))}</h4>${q.rationale?`<div class="rat">${q.rationale}</div>`:'<div>No explanation available.</div>'}</div><br><button class="btn" data-act="close">Close</button>`);
  });
}
applyTheme();
home();
</script>
</body>
</html>
